syntax = "proto3";

package launcher.tcp;

option php_namespace = "Launcher\\Tcp";
option php_metadata_namespace = "Launcher\\Tcp\\Metadata";

// Запрос авторизации в игре. Перед автологином клиент отправляет client_id + токен личного кабинета.
message GameAuthRequest {
  string client_id = 1; // 32-символьный идентификатор клиента (как ClientInfo.id)
  string token = 2;     // токен личного кабинета авторизуемого аккаунта
}
