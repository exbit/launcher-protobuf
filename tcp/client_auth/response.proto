syntax = "proto3";

package launcher.tcp;

option php_namespace = "Launcher\\Tcp";
option php_metadata_namespace = "Launcher\\Tcp\\Metadata\\ClientAuth";

// Ответ на ClientAuthRequest. При успехе status = "success". При ошибке status —
// код ошибки, который клиент переводит в локализованное сообщение и показывает
// модальное окно об окончании сессии. request_id ОБЯЗАН совпадать с запросом —
// по нему клиент маршрутизирует ответ (соединение мультиплексирует запросы).
message ClientAuthResponse {
  uint32 request_id = 1;        // эхо ClientAuthRequest.request_id (корреляция)
  repeated string accounts = 2; // эхо присланных uuid (подтверждение принятых аккаунтов)
  string status = 3;            // success, request-validation, auth-session-expired, internal-server-error
}
