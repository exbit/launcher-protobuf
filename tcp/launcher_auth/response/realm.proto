syntax = "proto3";

package launcher.tcp;

option php_namespace = "Launcher\\Tcp";
option php_metadata_namespace = "Launcher\\Tcp\\Metadata";

import "tcp/launcher_auth/response/realm_proxy.proto";

message Realm {
  uint32 id = 1;
  string name = 2;
  string address = 3;
  uint32 port = 4;
  bool status = 5;
  uint32 online = 6;
  int64 diff = 7;
  int64 uptime = 8;
  string country = 9;
  string city = 10;
  double lat = 11;
  double lon = 12;
  repeated RealmProxy proxies = 13;
}
