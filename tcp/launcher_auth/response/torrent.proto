syntax = "proto3";

package launcher.tcp;

option php_namespace = "Launcher\\Tcp";
option php_metadata_namespace = "Launcher\\Tcp\\Metadata";

import "tcp/launcher_auth/response/torrent_language.proto";

message Torrent {
  string title = 1;
  string hash = 2;
  uint64 size = 3;
  repeated TorrentLanguage languages = 4;
  repeated string exceptions = 5;
  int32 priority = 6;
}
