syntax = "proto3";

package launcher.tcp;

option php_namespace = "Launcher\\Tcp";
option php_metadata_namespace = "Launcher\\Tcp\\Metadata";

message RealmProxy {
  uint32 id = 1;
  string name = 2;
  string address = 3;
  uint32 port = 4;
  string country = 5;
  string city = 6;
  double lat = 7;
  double lon = 8;
}
